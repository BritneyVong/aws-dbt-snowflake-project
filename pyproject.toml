[project]
name = "britn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-snowflake>=1.12.1",
]

[project.scripts]
britn = "britn:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "dbt-snowflake",
]

[tool.uv.sources]
dbt-snowflake = { workspace = true }
